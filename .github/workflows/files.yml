name: UAP Archive - files poster

on:
  schedule:
    # Confirmed 2026-07-18: GitHub-runner IPs are NOT blocked by war.gov's
    # bot protection (real Chrome via Playwright is what matters). Runs
    # 3x/day - new tranches drop every few weeks, so this just needs to
    # catch a fresh release within hours, not race a live event.
    - cron: "20 6 * * *"
    - cron: "20 14 * * *"
    - cron: "20 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + real Chrome
        run: |
          pip install playwright
          playwright install --with-deps chrome

      - name: Run files poster
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 uap_files.py

      - name: Commit updated dedupe state
        run: |
          git config user.name "uap-archive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen_files.json
          git diff --cached --quiet || git commit -m "chore: update files seen-cache [skip ci]"
          git push
